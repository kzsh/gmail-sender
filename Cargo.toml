[package]
name = "gmail-sender"
version = "0.1.1"
edition = "2021"
description = "Send emails via Gmail API with OAuth2 authentication"
license = "MIT"
readme = "README.md"
keywords = ["gmail", "email", "oauth2", "google"]
categories = ["email", "api-bindings"]
publish = ["arx"]

[lib]
name = "gmail_sender"
path = "src/lib.rs"

[[bin]]
name = "gmail-sender"
path = "src/main.rs"

[dependencies]
google-gmail1 = "5.0.5"
yup-oauth2 = "12.1"
tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0"
base64 = "0.22"
mime_guess = "2.0"
dialoguer = "0.11"
serde_json = "1.0"
dirs = "5.0"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
